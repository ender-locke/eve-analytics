[build-system]
requires = ["uv-build>=0.11.8"]
build-backend = "uv_build"

[project]
name = "eve-analytics"
version = "0.0.1"
description = "Analytics package for eve online"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "pillow>=12.1.1",
    "pyyaml>=6.0.3",
    "wget>=3.2",
]